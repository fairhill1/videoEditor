[package]
name = "videoEditor"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
cpal = "0.18"
env_logger = "0.11.10"
ffmpeg-next = "9.0"
fontdue = "0.9.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.29"
pollster = "0.4.0"
rfd = "0.17"
ron = "=0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
wgpu = "29.0.1"
winit = "0.30.13"

# File drops on Wayland, which winit does not deliver there; see
# `src/wayland_drop.rs`. The same versions winit itself links, so the listener
# can share its connection.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.10"
wayland-backend = { version = "0.3.10", features = ["client_system"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
